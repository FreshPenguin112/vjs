name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Building QuickJS (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            name: linux-x64
            output: qjs_linux_x64.a

          - platform: macos-latest
            name: macos-x64
            output: qjs_macos_x64.a

          - platform: windows-latest
            name: windows-x64
            output: qjs_win_x64.a

          - platform: ubuntu-latest
            name: termux-arm64
            output: qjs_termux_arm64.a
            api: 24

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    # =========================
    # ANDROID NDK (TERMUX)
    # =========================
    - name: Install Android NDK
      if: matrix.name == 'termux-arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip android-ndk-r26d-linux.zip -d $HOME
        echo "NDK=$HOME/android-ndk-r26d" >> $GITHUB_ENV

    # =========================
    # CONFIGURE (LINUX / MAC)
    # =========================
    - name: Configure (Unix)
      if: matrix.name != 'windows-x64' && matrix.name != 'termux-arm64'
      run: |
        rm -rf build
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release

    # =========================
    # CONFIGURE (TERMUX / ANDROID)
    # =========================
    - name: Configure (Termux ARM64)
      if: matrix.name == 'termux-arm64'
      run: |
        rm -rf build
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
          -DCMAKE_SYSTEM_NAME=Android \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=${{ matrix.api }} \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON

    # =========================
    # CONFIGURE (WINDOWS)
    # =========================
    - name: Configure (Windows)
      if: matrix.name == 'windows-x64'
      shell: bash
      run: |
        rm -rf build
        cmake -S . -B build \
          -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=Release

    # =========================
    # BUILD
    # =========================
    - name: Build
      run: cmake --build build --config Release

    # =========================
    # COPY ARTIFACT
    # =========================
    - name: Copy output
      shell: bash
      run: |
        mkdir -p libs

        if [[ "${{ matrix.name }}" == "linux-x64" ]]; then
          cp build/libqjs.a libs/qjs_linux_x64.a
        elif [[ "${{ matrix.name }}" == "macos-x64" ]]; then
          cp build/libqjs.a libs/qjs_macos_x64.a
        elif [[ "${{ matrix.name }}" == "windows-x64" ]]; then
          cp build/libqjs.a libs/qjs_win_x64.a
        elif [[ "${{ matrix.name }}" == "termux-arm64" ]]; then
          cp build/libqjs.a libs/qjs_termux_arm64.a
        fi

    # =========================
    # CREATE PR (ALL PLATFORMS)
    # =========================
    - name: Create PR
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: Update ${{ matrix.name }}
        branch-suffix: random
        delete-branch: true
        title: Update ${{ matrix.name }}
        add-paths: |
          libs/${{ matrix.output }}
